fixed_phrases:
  not_understood: [GRAM.declarative, GRAM.negation, ACTION.understand, GRAM.agent_role, ENTITY.self]
  please_repeat: [GRAM.imperative, SOCIAL.please, ACTION.repeat]
  acknowledgement: [GRAM.declarative, SOCIAL.yes, SOCIAL.okay]
  low_battery_charge: [GRAM.declarative, SAFETY.low_battery, GRAM.separator, GRAM.imperative, SOCIAL.please, ACTION.charge, GRAM.patient_role, ENTITY.battery]
  obstacle_stop: [SAFETY.warning, SAFETY.obstacle_detected, GRAM.separator, GRAM.imperative, SAFETY.stop_now]
  tip_move_away: [SAFETY.warning, GRAM.imperative, SAFETY.move_away, GRAM.separator, SAFETY.tip_risk]
  amaze_three: [GRAM.declarative, SOCIAL.amaze, SOCIAL.amaze, SOCIAL.amaze]

decoder_policy:
  minimum_token_confidence: 0.85
  require_valid_token_checksum: true
  require_valid_message_checksum_for_exact_translation: true
  on_unknown_or_low_confidence: show_uncertainty_and_request_repeat
  ai_may_generate_arbitrary_notes: false
  ai_may_emit_physical_commands: false

translation_controls:
  physical_button:
    authoritative_convenience_control: true
    network_required: false
  voice_phrase: Rocky, translation mode
  clap_pattern:
    description: two_quick_claps_long_pause_one_clap
    first_interval_ms: [180, 350]
    second_interval_ms: [650, 1100]
    transient_refractory_ms: 120
    threshold_above_noise_floor_db: 12
    cooldown_ms: 3000
    safety_critical_use_allowed: false
  web_or_phone:
    authenticated_local_control: true
  optional_remote:
    loss_of_link_changes_state: false

translation_outputs:
  - spoken_english
  - phone_or_computer_subtitles
  - concealed_or_removable_display
  - private_bluetooth_earpiece
  - debug_tokens_and_confidence

extension_process:
  - Prefer composition from existing concepts.
  - Open a vocabulary issue defining the missing primitive and contrasts.
  - Allocate the next unused code within the correct class.
  - Never recycle or silently change a released code.
  - Increment the minor version for compatible additions.
  - Increment the major version for incompatible grammar or audio changes.
