name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  software-and-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run deterministic codec tests
        run: python -m unittest discover -s language/tests -v
      - name: Run RPA-Link tests
        run: python -m unittest discover -s software/rpa_link/tests -v
      - name: Run simulator tests
        run: python -m unittest discover -s software/simulation/tests -v
      - name: Run Brain v0.2 tests
        run: python -m unittest discover -s software/brain/tests -v
      - name: Focused EXP-002 runtime tests
        continue-on-error: true
        working-directory: software/rocky/tests
        run: python -m unittest test_translation_voice_exp002.Exp002RuntimeTests -v
      - name: Focused translation prosody tests
        continue-on-error: true
        working-directory: software/rocky/tests
        run: python -m unittest test_translation_voice_exp002.ProsodyTests -v
      - name: Focused persistent translation tests
        continue-on-error: true
        working-directory: software/rocky/tests
        run: python -m unittest test_translation_voice_exp002.PersistentTranslationTests -v
      - name: Legacy conversation regression tests
        continue-on-error: true
        working-directory: software/rocky/tests
        run: python -m unittest test_conversation -v
      - name: Legacy desktop-upgrade regression tests
        continue-on-error: true
        working-directory: software/rocky/tests
        run: python -m unittest test_desktop_upgrade -v
      - name: Legacy learning regression tests
        continue-on-error: true
        working-directory: software/rocky/tests
        run: python -m unittest test_learning -v
      - name: Legacy Chordic EXP-002 regression tests
        continue-on-error: true
        working-directory: software/rocky/tests
        run: python -m unittest test_chordic_exp002 -v
      - name: Legacy Windows-launcher regression tests
        continue-on-error: true
        working-directory: software/rocky/tests
        run: python -m unittest test_windows_launcher -v
      - name: Cumulative legacy through conversation
        continue-on-error: true
        working-directory: software/rocky/tests
        run: python -m unittest test_chordic_exp002 test_conversation -v
      - name: Cumulative legacy through desktop upgrade
        continue-on-error: true
        working-directory: software/rocky/tests
        run: python -m unittest test_chordic_exp002 test_conversation test_desktop_upgrade -v
      - name: Cumulative legacy through learning
        continue-on-error: true
        working-directory: software/rocky/tests
        run: python -m unittest test_chordic_exp002 test_conversation test_desktop_upgrade test_learning -v
      - name: Cumulative suite through translation voice
        continue-on-error: true
        working-directory: software/rocky/tests
        run: python -m unittest test_chordic_exp002 test_conversation test_desktop_upgrade test_learning test_translation_voice_exp002 -v
      - name: Cumulative full module order
        continue-on-error: true
        working-directory: software/rocky/tests
        run: python -m unittest test_chordic_exp002 test_conversation test_desktop_upgrade test_learning test_translation_voice_exp002 test_windows_launcher -v
      - name: Run Conversational Brain V1 tests (no model or speakers)
        shell: python
        run: |
          import sys
          import unittest
          if __name__ == '__main__':
              suite = unittest.defaultTestLoader.discover('software/rocky/tests')
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              # Preserve tracebacks in check annotations as well as authenticated logs.
              for test, traceback in result.errors + result.failures:
                  message = f'{test}\n{traceback}'
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error::{message}', flush=True)
              sys.exit(0 if result.wasSuccessful() else 1)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run browser protocol tests
        run: node software/brain_web/protocol.test.js

  arduino-uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Uno sketches
        uses: arduino/compile-sketches@v1
        with:
          fqbn: "arduino:avr:uno"
          libraries: "[]"
          sketch-paths: |
            - firmware
          enable-warnings-report: true
