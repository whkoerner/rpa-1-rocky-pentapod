          hit = any('test_memory' in row for row in rows)
          print('test_memory:', 'FAILURE_PRESENT' if hit else 'clear')
          sys.exit(1 if hit else 0)
      - name: Final failure marker test_symbolic_math
        continue-on-error: true
        shell: python
