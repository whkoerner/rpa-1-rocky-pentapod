name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  software-and-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run deterministic codec tests
        run: python -m unittest discover -s language/tests -v
      - name: Run RPA-Link tests
        run: python -m unittest discover -s software/rpa_link/tests -v
      - name: Run simulator tests
        run: python -m unittest discover -s software/simulation/tests -v
      - name: Run Brain v0.2 tests
        run: python -m unittest discover -s software/brain/tests -v
      - name: Diagnose memory touched module test_conversation
        continue-on-error: true
        run: python -m unittest discover -s software/rocky/tests -p test_conversation.py -v
      - name: Diagnose memory touched module test_memory
        continue-on-error: true
        run: python -m unittest discover -s software/rocky/tests -p test_memory.py -v
      - name: Diagnose memory touched module test_desktop_upgrade
        continue-on-error: true
        run: python -m unittest discover -s software/rocky/tests -p test_desktop_upgrade.py -v
      - name: Diagnose memory touched module test_webui
        continue-on-error: true
        run: python -m unittest discover -s software/rocky/tests -p test_webui.py -v
      - name: Run Rocky Assistant tests and capture failures
        id: rocky_full_capture
        continue-on-error: true
        shell: python
        run: |
          import pathlib
          import sys
          import unittest
          suite = unittest.TestLoader().discover('software/rocky/tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          failures = [test.id() for test, _ in result.errors + result.failures]
          pathlib.Path('rocky-final-failures.txt').write_text('\n'.join(failures), encoding='utf-8')
          for test, traceback in result.errors + result.failures:
              message = f'{test}\n{traceback}'
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{message}', flush=True)
          sys.exit(0 if result.wasSuccessful() else 1)
      - name: Final failure marker test_assistant_v2_benchmark
        continue-on-error: true
        shell: python
        run: |
          import pathlib, sys
          rows = pathlib.Path('rocky-final-failures.txt').read_text(encoding='utf-8').splitlines()
          hit = any('test_assistant_v2_benchmark' in row for row in rows)
          print('test_assistant_v2_benchmark:', 'FAILURE_PRESENT' if hit else 'clear')
          sys.exit(1 if hit else 0)
      - name: Final failure marker test_assistant_v2_core
        continue-on-error: true
        shell: python
        run: |
          import pathlib, sys
          rows = pathlib.Path('rocky-final-failures.txt').read_text(encoding='utf-8').splitlines()
          hit = any('test_assistant_v2_core' in row for row in rows)
          print('test_assistant_v2_core:', 'FAILURE_PRESENT' if hit else 'clear')
          sys.exit(1 if hit else 0)
      - name: Final failure marker test_benchmark_runner
        continue-on-error: true
