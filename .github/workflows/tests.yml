name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  software-and-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run deterministic codec tests
        run: python -m unittest discover -s language/tests -v
      - name: Run RPA-Link tests
        run: python -m unittest discover -s software/rpa_link/tests -v
      - name: Run simulator tests
        run: python -m unittest discover -s software/simulation/tests -v
      - name: Run Brain v0.2 tests
        run: python -m unittest discover -s software/brain/tests -v
      - name: Run Conversational Brain V1 tests (no model or speakers)
        shell: python
        run: |
          import sys
          import unittest
          if __name__ == '__main__':
              suite = unittest.TestLoader().discover('software/rocky/tests')
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              # Preserve tracebacks in check annotations as well as authenticated logs.
              for test, traceback in result.errors + result.failures:
                  message = f'{test}\n{traceback}'
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error::{message}', flush=True)
              sys.exit(0 if result.wasSuccessful() else 1)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run browser protocol tests
        run: node software/brain_web/protocol.test.js

  rocky-diagnostic:
    name: rocky-diagnostic (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: chordic
            command: python -m unittest test_chordic_exp002 -v
          - label: through-conversation
            command: python -m unittest test_chordic_exp002 test_conversation -v
          - label: through-desktop
            command: python -m unittest test_chordic_exp002 test_conversation test_desktop_upgrade -v
          - label: through-learning
            command: python -m unittest test_chordic_exp002 test_conversation test_desktop_upgrade test_learning -v
          - label: through-translation
            command: python -m unittest test_chordic_exp002 test_conversation test_desktop_upgrade test_learning test_translation_voice_exp002 -v
          - label: full-module-order
            command: python -m unittest test_chordic_exp002 test_conversation test_desktop_upgrade test_learning test_translation_voice_exp002 test_windows_launcher -v
          - label: standard-discovery
            command: python -m unittest discover -s software/rocky/tests -v
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run diagnostic
        env:
          PYTHONPATH: software/rocky/tests
        run: ${{ matrix.command }}
  rocky-translation-diagnostic:
    name: rocky-translation-diagnostic (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: exp002-class
            suffix: test_translation_voice_exp002.Exp002RuntimeTests
          - label: prosody-class
            suffix: test_translation_voice_exp002.ProsodyTests
          - label: persistent-class
            suffix: test_translation_voice_exp002.PersistentTranslationTests
          - label: module-only
            suffix: test_translation_voice_exp002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run translation interaction diagnostic
        env:
          PYTHONPATH: software/rocky/tests
        run: python -m unittest test_chordic_exp002 test_conversation test_desktop_upgrade test_learning ${{ matrix.suffix }} -v
  rocky-method-diagnostic:
    name: rocky-method-diagnostic (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: exp-pin
            test: test_translation_voice_exp002.Exp002RuntimeTests.test_runtime_export_is_pinned_to_chordic_main_and_collision_free
          - label: exp-roundtrip
            test: test_translation_voice_exp002.Exp002RuntimeTests.test_all_registered_benchmark_meanings_round_trip
          - label: exp-freeform
            test: test_translation_voice_exp002.Exp002RuntimeTests.test_free_form_uses_composition_plus_explicit_exact_ct2_fallback
          - label: exp-timing
            test: test_translation_voice_exp002.Exp002RuntimeTests.test_normal_benchmark_reproduces_exp002_speed_target_at_unchanged_3x
          - label: exp-legacy-ct2
            test: test_translation_voice_exp002.Exp002RuntimeTests.test_ct2_remains_available_as_legacy_profile
          - label: persist-on-off
            test: test_translation_voice_exp002.PersistentTranslationTests.test_translation_on_persists_two_turns_then_off_stops_voice
          - label: persist-clear
            test: test_translation_voice_exp002.PersistentTranslationTests.test_status_and_clear_preserve_session_mode
          - label: persist-controls
            test: test_translation_voice_exp002.PersistentTranslationTests.test_mute_cancel_stop_reset_and_unmute_control_voice
          - label: persist-replay
            test: test_translation_voice_exp002.PersistentTranslationTests.test_replay_replays_voice_only_when_translation_is_on
          - label: persist-error
            test: test_translation_voice_exp002.PersistentTranslationTests.test_voice_error_is_surfaced_and_latches_stop
          - label: persist-language
            test: test_translation_voice_exp002.PersistentTranslationTests.test_language_command_switches_future_profile_without_deleting_ct2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run isolated method after passing legacy base
        env:
          PYTHONPATH: software/rocky/tests
        run: python -m unittest test_chordic_exp002 test_conversation test_desktop_upgrade test_learning ${{ matrix.test }} -v
  arduino-uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Uno sketches
        uses: arduino/compile-sketches@v1
        with:
          fqbn: "arduino:avr:uno"
          libraries: "[]"
          sketch-paths: |
            - firmware
          enable-warnings-report: true
