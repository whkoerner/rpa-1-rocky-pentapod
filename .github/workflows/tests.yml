          for name in modules:
              importlib.import_module(name)
          suite = unittest.defaultTestLoader.loadTestsFromName('test_conversation')
          sys.exit(0 if unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful() else 1)
      - name: Diagnose preimport-all then test_desktop_upgrade
