          import pathlib, sys
          rows = pathlib.Path('rocky-final-failures.txt').read_text(encoding='utf-8').splitlines()
          hit = any('test_symbolic_math' in row for row in rows)
          print('test_symbolic_math:', 'FAILURE_PRESENT' if hit else 'clear')
          sys.exit(1 if hit else 0)
      - name: Final failure marker test_translation_voice_exp002
        continue-on-error: true
        shell: python
        run: |
          import pathlib, sys
          rows = pathlib.Path('rocky-final-failures.txt').read_text(encoding='utf-8').splitlines()
          hit = any('test_translation_voice_exp002' in row for row in rows)
          print('test_translation_voice_exp002:', 'FAILURE_PRESENT' if hit else 'clear')
          sys.exit(1 if hit else 0)
      - name: Final failure marker test_webui
        continue-on-error: true
        shell: python
        run: |
          import pathlib, sys
          rows = pathlib.Path('rocky-final-failures.txt').read_text(encoding='utf-8').splitlines()
          hit = any('test_webui' in row for row in rows)
          print('test_webui:', 'FAILURE_PRESENT' if hit else 'clear')
          sys.exit(1 if hit else 0)
      - name: Final failure marker test_windows_launcher
        continue-on-error: true
        shell: python
        run: |
          import pathlib, sys
          rows = pathlib.Path('rocky-final-failures.txt').read_text(encoding='utf-8').splitlines()
          hit = any('test_windows_launcher' in row for row in rows)
          print('test_windows_launcher:', 'FAILURE_PRESENT' if hit else 'clear')
          sys.exit(1 if hit else 0)
      - name: Enforce Rocky Assistant test result
        shell: python
        run: |
          import pathlib, sys
          rows = pathlib.Path('rocky-final-failures.txt').read_text(encoding='utf-8').splitlines()
          sys.exit(1 if rows else 0)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run browser protocol tests
        run: node software/brain_web/protocol.test.js

  arduino-uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Uno sketches
        uses: arduino/compile-sketches@v1
        with:
          fqbn: "arduino:avr:uno"
          libraries: "[]"
          sketch-paths: |
            - firmware
          enable-warnings-report: true
