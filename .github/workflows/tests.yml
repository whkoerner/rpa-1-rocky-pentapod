name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  software-and-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run deterministic codec tests
        run: python -m unittest discover -s language/tests -v
      - name: Run RPA-Link tests
        run: python -m unittest discover -s software/rpa_link/tests -v
      - name: Run simulator tests
        run: python -m unittest discover -s software/simulation/tests -v
      - name: Run Brain v0.2 tests
        run: python -m unittest discover -s software/brain/tests -v
      - name: Stress fresh Rocky discovery and capture first failure
        id: stress_rocky_discovery
        continue-on-error: true
        shell: python
        run: |
          import json, pathlib, subprocess, sys, textwrap
          child = r'''
          import json, pathlib, sys, unittest
          suite = unittest.TestLoader().discover("software/rocky/tests")
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          failures = [test.id() for test, _ in result.failures + result.errors]
          pathlib.Path("rocky-child-failures.json").write_text(json.dumps(failures), encoding="utf-8")
          raise SystemExit(0 if result.wasSuccessful() else 1)
          '''
          first = []
          for index in range(1, 5):
              pathlib.Path("rocky-child-failures.json").unlink(missing_ok=True)
              result = subprocess.run([sys.executable, "-c", child], check=False)
              rows = json.loads(pathlib.Path("rocky-child-failures.json").read_text(encoding="utf-8"))
              print(f"fresh discovery {index}: returncode={result.returncode}; failures={rows}", flush=True)
              if result.returncode:
                  first = rows
                  break
          pathlib.Path("rocky-discovery-failures.txt").write_text("\n".join(first), encoding="utf-8")
          sys.exit(1 if first else 0)
      - name: Flake marker test_assistant_v2_benchmark
        continue-on-error: true
        shell: python
        run: |
          import pathlib, sys
          rows = pathlib.Path('rocky-discovery-failures.txt').read_text(encoding='utf-8').splitlines()
          hit = any(row.startswith('test_assistant_v2_benchmark.') or row.startswith('software.rocky.tests.test_assistant_v2_benchmark.') for row in rows)
          print('test_assistant_v2_benchmark:', 'FLAKE_PRESENT' if hit else 'clear')
          sys.exit(1 if hit else 0)
      - name: Flake marker test_assistant_v2_core
        continue-on-error: true
