        run: |
          import pathlib, sys
          rows = pathlib.Path('rocky-final-failures.txt').read_text(encoding='utf-8').splitlines()
          hit = any('test_benchmark_runner' in row for row in rows)
          print('test_benchmark_runner:', 'FAILURE_PRESENT' if hit else 'clear')
