name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  software-and-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run deterministic codec tests
        run: python -m unittest discover -s language/tests -v
      - name: Run RPA-Link tests
        run: python -m unittest discover -s software/rpa_link/tests -v
      - name: Run simulator tests
        run: python -m unittest discover -s software/simulation/tests -v
      - name: Run Brain v0.2 tests
        run: python -m unittest discover -s software/brain/tests -v
      - name: Diagnose memory module compilation
        run: python -m py_compile software/rocky/memory.py software/rocky/providers.py software/rocky/conversation.py software/rocky/cli.py software/rocky/webui.py
      - name: Diagnose cumulative memory prefix 0
        continue-on-error: true
        shell: python
        run: |
          import sys, unittest
          sys.path.insert(0, 'software/rocky/tests')
          modules = ["test_assistant_v2_benchmark","test_assistant_v2_core","test_benchmark_runner","test_chordic_exp002","test_conversation","test_desktop_upgrade","test_exp003_runtime","test_learning","test_memory"]
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(m) for m in modules)
          sys.exit(0 if unittest.TextTestRunner(verbosity=1).run(suite).wasSuccessful() else 1)
      - name: Diagnose cumulative memory prefix 1
        continue-on-error: true
        shell: python
        run: |
          import sys, unittest
          sys.path.insert(0, 'software/rocky/tests')
          modules = ["test_assistant_v2_benchmark","test_assistant_v2_core","test_benchmark_runner","test_chordic_exp002","test_conversation","test_desktop_upgrade","test_exp003_runtime","test_learning","test_memory","test_symbolic_math"]
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(m) for m in modules)
          sys.exit(0 if unittest.TextTestRunner(verbosity=1).run(suite).wasSuccessful() else 1)
      - name: Diagnose cumulative memory prefix 2
        continue-on-error: true
        shell: python
        run: |
          import sys, unittest
          sys.path.insert(0, 'software/rocky/tests')
          modules = ["test_assistant_v2_benchmark","test_assistant_v2_core","test_benchmark_runner","test_chordic_exp002","test_conversation","test_desktop_upgrade","test_exp003_runtime","test_learning","test_memory","test_symbolic_math","test_translation_voice_exp002"]
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(m) for m in modules)
          sys.exit(0 if unittest.TextTestRunner(verbosity=1).run(suite).wasSuccessful() else 1)
      - name: Diagnose cumulative memory prefix 3
        continue-on-error: true
        shell: python
        run: |
          import sys, unittest
          sys.path.insert(0, 'software/rocky/tests')
          modules = ["test_assistant_v2_benchmark","test_assistant_v2_core","test_benchmark_runner","test_chordic_exp002","test_conversation","test_desktop_upgrade","test_exp003_runtime","test_learning","test_memory","test_symbolic_math","test_translation_voice_exp002","test_webui"]
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(m) for m in modules)
          sys.exit(0 if unittest.TextTestRunner(verbosity=1).run(suite).wasSuccessful() else 1)
      - name: Diagnose cumulative memory prefix 4
        continue-on-error: true
        shell: python
        run: |
          import sys, unittest
          sys.path.insert(0, 'software/rocky/tests')
          modules = ["test_assistant_v2_benchmark","test_assistant_v2_core","test_benchmark_runner","test_chordic_exp002","test_conversation","test_desktop_upgrade","test_exp003_runtime","test_learning","test_memory","test_symbolic_math","test_translation_voice_exp002","test_webui","test_windows_launcher"]
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(m) for m in modules)
          sys.exit(0 if unittest.TextTestRunner(verbosity=1).run(suite).wasSuccessful() else 1)
      - name: Diagnose explicit all Rocky modules
        continue-on-error: true
        shell: python
        run: |
          import sys, unittest
          sys.path.insert(0, 'software/rocky/tests')
          modules = ["test_assistant_v2_benchmark","test_assistant_v2_core","test_benchmark_runner","test_chordic_exp002","test_conversation","test_desktop_upgrade","test_exp003_runtime","test_learning","test_memory","test_symbolic_math","test_translation_voice_exp002","test_webui","test_windows_launcher"]
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(m) for m in modules)
          sys.exit(0 if unittest.TextTestRunner(verbosity=1).run(suite).wasSuccessful() else 1)
      - name: Run Rocky Assistant tests (no model or speakers)
        shell: python
        run: |
          import sys
          import unittest
          if __name__ == '__main__':
              suite = unittest.TestLoader().discover('software/rocky/tests')
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              # Preserve tracebacks in check annotations as well as authenticated logs.
              for test, traceback in result.errors + result.failures:
                  message = f'{test}\n{traceback}'
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error::{message}', flush=True)
              sys.exit(0 if result.wasSuccessful() else 1)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run browser protocol tests
        run: node software/brain_web/protocol.test.js

  arduino-uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Uno sketches
        uses: arduino/compile-sketches@v1
        with:
          fqbn: "arduino:avr:uno"
          libraries: "[]"
          sketch-paths: |
            - firmware
          enable-warnings-report: true
